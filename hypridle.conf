# Replaces broken-hypridle.conf. That version used brightnessctl (not installed,
# and it can't control DP monitors) and the old `hyprctl dispatch dpms` syntax,
# which doesn't work now that the main config is Lua.

general {
    lock_cmd = pidof hyprlock || hyprlock                            # avoid multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                         # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # wake displays without a double keypress
}

listener {
    timeout = 820                                # ~13.5 min
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 1200                                               # 20 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screens off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # screens on
}

# Evening warm/dim schedule. hyprsunset applies whichever profile started most recently.
# If you change the times or values, update scripts/idle-restore.sh to match.

profile {
    time = 7:00
    identity = true      # daytime: no tint, full brightness
}

profile {
    time = 18:00
    temperature = 4500   # warm, easier on the eyes
    gamma = 0.9          # 90% brightness
}
